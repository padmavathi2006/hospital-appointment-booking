<!-- This line declares the document type so the browser renders the page in modern HTML mode. -->
<!DOCTYPE html>
<!-- This line starts the HTML document and sets the page language to English. -->
<html lang="en">
<head>
    <!-- This line sets the character encoding so text displays correctly. -->
    <meta charset="UTF-8">
    <!-- This line makes the page responsive on mobile and desktop screens. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This line sets the page title shown in the browser tab. -->
    <title>Login | Hospital Appointment Booking System</title>
    <!-- This line loads Bootstrap CSS from a CDN for professional responsive styling. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- This line loads Font Awesome icons from a CDN for modern interface icons. -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <!-- This line loads the custom CSS file for project-specific design. -->
    <link href="/css/style.css" rel="stylesheet">
</head>
<!-- This line starts the body and marks this page as the login page for JavaScript logic. -->
<body data-page="login" class="auth-page">
    <!-- This line starts the main authentication section. -->
    <section class="auth-section">
        <!-- This line creates a centered container for the split authentication layout. -->
        <div class="container py-5">
            <!-- This line creates a row that centers the authentication card vertically. -->
            <div class="row justify-content-center align-items-center min-vh-100">
                <!-- This line creates the full-width column for the authentication card. -->
                <div class="col-xl-10">
                    <!-- This line starts the main authentication card. -->
                    <div class="card auth-card border-0 shadow-lg overflow-hidden">
                        <!-- This line creates a row inside the authentication card. -->
                        <div class="row g-0">
                            <!-- This line creates the left image panel. -->
                            <div class="col-lg-6 auth-visual d-none d-lg-flex">
                                <!-- This line wraps the left panel content. -->
                                <div class="p-5 text-white w-100 d-flex flex-column justify-content-center">
                                    <!-- This line shows the panel title. -->
                                    <h2 class="fw-bold mb-3">Secure Hospital Login</h2>
                                    <!-- This line shows the panel description. -->
                                    <p class="mb-4 text-white-50">Log in as a patient to book appointments or as an admin to manage doctors and reports.</p>
                                    <!-- This line displays the login side illustration. -->
                                    <img src="/images/login-illustration.svg" class="img-fluid auth-side-image" alt="Medical login illustration">
                                </div>
                            </div>
                            <!-- This line creates the right form panel. -->
                            <div class="col-lg-6 bg-white">
                                <!-- This line wraps the form content. -->
                                <div class="p-4 p-lg-5">
                                    <!-- This line shows a small brand heading. -->
                                    <a class="text-decoration-none text-primary fw-bold d-inline-block mb-3" href="/"><i class="fa-solid fa-hospital me-2"></i>HospitalCare</a>
                                    <!-- This line shows the main form heading. -->
                                    <h3 class="fw-bold mb-2">Welcome Back</h3>
                                    <!-- This line shows the form subtitle. -->
                                    <p class="text-muted mb-4">Enter your account details to continue.</p>
                                    <!-- This line creates an alert box for login messages. -->
                                    <div id="loginMessage" class="alert d-none" role="alert"></div>
                                    <!-- This line starts the login form. -->
                                    <form id="loginForm" novalidate>
                                        <!-- This line starts the role selection field group. -->
                                        <div class="mb-3">
                                            <!-- This line labels the role dropdown. -->
                                            <label for="loginRole" class="form-label">Login As</label>
                                            <!-- This line creates the role dropdown for patient or admin login. -->
                                            <select id="loginRole" class="form-select" required>
                                                <!-- This line creates the patient role option. -->
                                                <option value="patient">Patient</option>
                                                <!-- This line creates the admin role option. -->
                                                <option value="admin">Admin</option>
                                            </select>
                                        </div>
                                        <!-- This line starts the email field group. -->
                                        <div class="mb-3">
                                            <!-- This line labels the email field. -->
                                            <label for="loginEmail" class="form-label">Email Address</label>
                                            <!-- This line creates the email input field. -->
                                            <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email">
                                        </div>
                                        <!-- This line starts the password field group. -->
                                        <div class="mb-3">
                                            <!-- This line labels the password field. -->
                                            <label for="loginPassword" class="form-label">Password</label>
                                            <!-- This line creates the password input field. -->
                                            <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password">
                                        </div>
                                        <!-- This line creates the submit button for the login form. -->
                                        <button type="submit" class="btn btn-primary w-100 py-2"><i class="fa-solid fa-right-to-bracket me-2"></i>Login</button>
                                    </form>
                                    <!-- This line shows the registration link below the form. -->
                                    <p class="text-muted mt-4 mb-0">New patient? <a href="/register" class="text-decoration-none">Create an account</a></p>
                                    <!-- This line shows the default admin credentials for quick testing. -->
                                    <div class="admin-info-box mt-4">
                                        <strong>Default Admin Login</strong><br>
                                        Email: admin@gmail.com<br>
                                        Password: admin123
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- This line loads Bootstrap JavaScript for interactive components. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- This line loads the shared frontend JavaScript file. -->
    <script src="/js/script.js"></script>
</body>
</html>
